name: Validate Skill

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate skill package (SKILL.md / _meta.json / package.json)
        run: node scripts/validate.mjs

      - name: Smoke-test scanner script
        run: |
          node skill-consolidator/scripts/scan_skills.mjs --no-write --output /tmp/report.md >/dev/null
          echo "scanner runs OK"
